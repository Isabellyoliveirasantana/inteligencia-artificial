<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ECO DA MEIA-NOITE</title>

<style>
:root {
    --bg: #080208;
    --bg2: #120313;
    --pink: #ff2bd6;
    --pink2: #ff65e4;
    --purple: #9b2cff;
    --cyan: #65eaff;
    --white: #fff7ff;
    --muted: #a58fa4;
    --line: rgba(255,43,214,.22);
    --panel: rgba(18,3,19,.82);
    --danger: #ff416c;
    --success: #6cffb0;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--white);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
input {
    font: inherit;
}

button {
    border: 0;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,43,214,.13),
            transparent 35%
        ),
        var(--bg);
}

/* =========================
   TELAS
========================= */

.screen {
    position: absolute;
    inset: 0;
    opacity: 0;
    pointer-events: none;
    transform: scale(1.02);
    transition:
        opacity .6s ease,
        transform .6s ease;
}

.screen.active {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
}

/* =========================
   INTRO
========================= */

#intro {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,43,214,.18),
            transparent 28%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(155,44,255,.12),
            transparent 25%
        ),
        #080208;
}

.noise {
    position: absolute;
    inset: 0;
    opacity: .04;
    pointer-events: none;

    background-image:
        repeating-linear-gradient(
            0deg,
            transparent 0 2px,
            rgba(255,255,255,.15) 3px
        );
}

.intro-content {
    position: relative;
    z-index: 2;
    width: min(800px, 90vw);
    animation: introIn 1.2s ease both;
}

.eyebrow {
    color: var(--pink2);
    font-size: 11px;
    letter-spacing: 7px;
    text-transform: uppercase;
    margin-bottom: 25px;
    text-shadow: 0 0 20px var(--pink);
}

.logo {
    font-size: clamp(48px, 10vw, 130px);
    line-height: .82;
    font-weight: 200;
    letter-spacing: clamp(3px, 1vw, 16px);

    color: #fff;

    text-shadow:
        0 0 10px rgba(255,43,214,.7),
        0 0 35px rgba(255,43,214,.35),
        0 0 80px rgba(155,44,255,.25);
}

.logo span {
    color: var(--pink);
}

.logo-line {
    width: min(280px, 50vw);
    height: 1px;
    margin: 32px auto;
    background:
        linear-gradient(
            90deg,
            transparent,
            var(--pink),
            transparent
        );
    box-shadow: 0 0 15px var(--pink);
}

.subtitle {
    color: var(--muted);
    font-size: clamp(12px, 1.5vw, 17px);
    line-height: 1.7;
    letter-spacing: 1px;
    margin-bottom: 40px;
}

.start {
    padding: 15px 30px;
    border-radius: 999px;

    color: white;
    background:
        linear-gradient(
            135deg,
            rgba(255,43,214,.2),
            rgba(155,44,255,.15)
        );

    border: 1px solid rgba(255,43,214,.55);

    box-shadow:
        0 0 20px rgba(255,43,214,.15),
        inset 0 0 20px rgba(255,43,214,.05);

    cursor: pointer;
    transition: .25s;
}

.start:hover {
    transform: translateY(-3px);
    background: rgba(255,43,214,.2);
    box-shadow:
        0 0 35px rgba(255,43,214,.35);
}

@keyframes introIn {
    from {
        opacity: 0;
        transform: translateY(25px);
    }

    to {
        opacity: 1;
        transform: none;
    }
}

/* =========================
   HISTÓRIA
========================= */

#story {
    background: #070107;
}

.topbar {
    position: absolute;
    z-index: 20;
    top: 0;
    left: 0;
    right: 0;

    height: 70px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 clamp(16px, 4vw, 55px);

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.75),
            transparent
        );
}

.title {
    font-size: 11px;
    letter-spacing: 4px;
    color: rgba(255,255,255,.65);
}

.title b {
    color: var(--pink);
    text-shadow: 0 0 15px var(--pink);
}

.top-right {
    display: flex;
    align-items: center;
    gap: 12px;
}

.time {
    color: var(--pink2);
    font-size: 12px;
    text-shadow: 0 0 10px var(--pink);
}

.phone-button {
    width: 40px;
    height: 40px;
    border-radius: 50%;

    color: white;
    background: rgba(255,43,214,.08);
    border: 1px solid rgba(255,43,214,.35);

    cursor: pointer;
    transition: .2s;
}

.phone-button:hover {
    transform: scale(1.08);
    background: rgba(255,43,214,.18);
    box-shadow: 0 0 20px rgba(255,43,214,.3);
}

/* =========================
   CENÁRIO
========================= */

.scene {
    position: absolute;
    inset: 0;
    overflow: hidden;
}

.background {
    position: absolute;
    inset: -5%;
    width: 110%;
    height: 110%;

    transition:
        opacity .7s ease,
        background .8s ease;

    animation: breathing 10s ease-in-out infinite alternate;
}

.background.room {
    background:
        radial-gradient(
            ellipse at 70% 25%,
            rgba(255,43,214,.15),
            transparent 20%
        ),
        linear-gradient(
            120deg,
            #100510,
            #070107 55%,
            #17051a
        );
}

.background.rooftop {
    background:
        radial-gradient(
            circle at 75% 20%,
            rgba(255,43,214,.35),
            transparent 13%
        ),
        linear-gradient(
            135deg,
            #09020d,
            #19041b 45%,
            #030103
        );
}

.background.station {
    background:
        radial-gradient(
            ellipse at 50% 30%,
            rgba(155,44,255,.25),
            transparent 20%
        ),
        linear-gradient(
            115deg,
            #100412,
            #1c061c,
            #050106
        );
}

.background::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0 80px,
            rgba(255,43,214,.025) 81px 82px
        );
}

.background::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 45%;

    background:
        linear-gradient(
            to top,
            rgba(0,0,0,.9),
            transparent
        );
}

@keyframes breathing {
    from {
        transform: scale(1);
    }

    to {
        transform: scale(1.035);
    }
}

/* =========================
   LUZES
========================= */

.neon-light {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;

    background: var(--pink);
    filter: blur(100px);
    opacity: .08;

    pointer-events: none;
}

.light-one {
    top: 20%;
    left: 15%;
}

.light-two {
    right: 10%;
    bottom: 20%;
    background: var(--purple);
}

/* =========================
   PERSONAGEM
========================= */

.person {
    position: absolute;
    left: 50%;
    bottom: 6%;

    width: clamp(140px, 20vw, 300px);
    height: clamp(300px, 65vh, 650px);

    transform: translateX(-50%);
    opacity: 0;

    transition:
        opacity .6s ease,
        transform .6s ease;
}

.person.show {
    opacity: .95;
}

.person-head {
    position: absolute;
    top: 0;
    left: 50%;

    width: 24%;
    aspect-ratio: 1;

    transform: translateX(-50%);

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #d6b4ce,
            #65495f 55%,
            #1d101c
        );

    box-shadow:
        0 0 40px rgba(255,43,214,.15);
}

.person-body {
    position: absolute;
    left: 50%;
    bottom: 0;

    width: 72%;
    height: 78%;

    transform: translateX(-50%);

    border-radius: 35% 35% 8% 8%;

    background:
        linear-gradient(
            100deg,
            #251021,
            #080308 65%,
            #32112e
        );

    box-shadow:
        0 0 80px rgba(0,0,0,.9);
}

/* =========================
   TEXTO
========================= */

.story {
    position: absolute;
    z-index: 10;

    left: 0;
    right: 0;
    bottom: 0;

    padding:
        0 clamp(15px, 7vw, 110px)
        clamp(18px, 5vh, 60px);
}

.story-inner {
    width: min(1100px, 100%);
    margin: auto;
}

.location {
    display: flex;
    align-items: center;
    gap: 10px;

    color: var(--pink2);
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;

    margin-bottom: 12px;

    text-shadow: 0 0 12px var(--pink);
}

.location::before {
    content: "";
    width: 28px;
    height: 1px;
    background: var(--pink);
    box-shadow: 0 0 8px var(--pink);
}

.narrator {
    max-width: 850px;

    color: #aa93a7;
    font-size: clamp(11px, 1.3vw, 15px);
    line-height: 1.6;

    margin-bottom: 9px;
}

.dialogue {
    max-width: 1000px;

    font-size: clamp(20px, 3vw, 38px);
    line-height: 1.15;
    font-weight: 300;

    text-shadow:
        0 0 25px rgba(0,0,0,.9);
}

.speaker {
    display: block;

    color: var(--pink2);
    font-size: 10px;
    letter-spacing: 4px;
    margin-bottom: 7px;

    text-shadow: 0 0 10px var(--pink);
}

/* =========================
   ESCOLHAS
========================= */

.choices {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));

    gap: 9px;
    margin-top: 20px;

    max-width: 900px;
}

.choice {
    min-height: 52px;

    padding: 13px 17px;

    text-align: left;
    color: white;

    background:
        linear-gradient(
            135deg,
            rgba(255,43,214,.08),
            rgba(20,2,20,.72)
        );

    border:
        1px solid rgba(255,43,214,.22);

    border-radius: 9px;

    cursor: pointer;

    transition: .25s;

    backdrop-filter: blur(12px);
}

.choice:hover {
    transform: translateY(-2px);

    border-color: var(--pink);

    background:
        rgba(255,43,214,.13);

    box-shadow:
        0 0 25px rgba(255,43,214,.13);
}

@media(max-width:700px) {
    .choices {
        grid-template-columns: 1fr;
    }

    .dialogue {
        font-size: clamp(19px, 6vw, 29px);
    }
}

/* =========================
   CELULAR
========================= */

.phone-layer {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.75);
    backdrop-filter: blur(14px);

    opacity: 0;
    pointer-events: none;

    transition: .3s;
}

.phone-layer.open {
    opacity: 1;
    pointer-events: auto;
}

.phone {
    position: relative;

    width: min(390px, 90vw);
    height: min(740px, 88vh);

    overflow: hidden;

    border: 6px solid #21091f;
    border-radius: 42px;

    background: #080208;

    box-shadow:
        0 30px 100px rgba(0,0,0,.8),
        0 0 40px rgba(255,43,214,.15);

    transform: translateY(30px) scale(.94);

    transition: .4s;
}

.phone-layer.open .phone {
    transform: none;
}

.notch {
    position: absolute;
    z-index: 5;

    top: 0;
    left: 50%;
    transform: translateX(-50%);

    width: 100px;
    height: 25px;

    background: #030103;

    border-radius: 0 0 15px 15px;
}

.phone-screen {
    position: absolute;
    inset: 0;
}

.phone-page {
    position: absolute;
    inset: 0;

    display: none;
    flex-direction: column;

    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,43,214,.12),
            transparent 35%
        ),
        #080208;
}

.phone-page.active {
    display: flex;
}

/* Home */

.home {
    padding: 100px 24px 25px;
}

.phone-clock {
    font-size: 54px;
    font-weight: 200;
    color: white;

    text-shadow:
        0 0 20px rgba(255,43,214,.3);
}

.phone-date {
    color: var(--muted);
    font-size: 12px;
}

.apps {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 20px;

    margin-top: 50px;
}

.app {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;

    color: #b99bb5;
    background: none;

    cursor: pointer;
}

.icon {
    width: 58px;
    height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 17px;

    background:
        rgba(255,43,214,.09);

    border:
        1px solid rgba(255,43,214,.2);

    font-size: 23px;

    box-shadow:
        0 0 20px rgba(255,43,214,.06);
}

.label {
    font-size: 10px;
}

/* Phone header */

.phone-header {
    height: 65px;
    flex: none;

    padding: 27px 18px 7px;

    display: flex;
    align-items: flex-end;
    justify-content: space-between;

    border-bottom: 1px solid rgba(255,43,214,.12);
}

.phone-header h2 {
    font-size: 17px;
    font-weight: 400;
}

.phone-header button {
    background: none;
    color: var(--pink2);
    cursor: pointer;
}

/* Contacts */

.contacts {
    flex: 1;
    overflow: auto;
    padding: 12px;
}

.contact {
    width: 100%;

    display: flex;
    align-items: center;
    gap: 12px;

    padding: 13px 8px;

    background: none;
    color: white;

    border-bottom:
        1px solid rgba(255,43,214,.08);

    text-align: left;
    cursor: pointer;
}

.avatar {
    width: 42px;
    height: 42px;
    flex: none;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    color: white;

    background:
        linear-gradient(
            135deg,
            #7e2871,
            #261022
        );

    box-shadow:
        0 0 15px rgba(255,43,214,.12);
}

.contact-info {
    flex: 1;
    min-width: 0;
}

.contact-name {
    font-size: 13px;
}

.contact-last {
    margin-top: 3px;

    color: #7e687b;
    font-size: 10px;

    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

/* Chat */

.chat-head {
    flex: none;

    height: 65px;

    display: flex;
    align-items: flex-end;
    gap: 10px;

    padding: 25px 12px 8px;

    border-bottom:
        1px solid rgba(255,43,214,.1);
}

.chat-back {
    background: none;
    color: var(--pink2);
    cursor: pointer;
    font-size: 18px;
}

.chat-person {
    flex: 1;
}

.chat-person strong {
    display: block;
    font-size: 13px;
}

.status {
    color: var(--pink);
    font-size: 9px;
}

.messages {
    flex: 1;
    min-height: 0;

    overflow: auto;

    display: flex;
    flex-direction: column;
    gap: 7px;

    padding: 15px 12px;
}

.message {
    max-width: 78%;

    padding: 9px 11px;

    border-radius: 15px;

    font-size: 12px;
    line-height: 1.35;
}

.message.me {
    align-self: flex-end;

    color: #160311;

    background:
        linear-gradient(
            135deg,
            var(--pink2),
            var(--pink)
        );

    border-bottom-right-radius: 4px;
}

.message.them {
    align-self: flex-start;

    color: white;

    background: #211021;

    border-bottom-left-radius: 4px;
}

.input-area {
    flex: none;

    display: flex;
    gap: 7px;

    padding: 8px;

    border-top:
        1px solid rgba(255,43,214,.1);
}

.input-area input {
    flex: 1;
    min-width: 0;

    height: 38px;

    padding: 0 13px;

    color: white;

    outline: none;

    border: 1px solid rgba(255,43,214,.16);
    border-radius: 20px;

    background: #140914;
}

.input-area button {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    color: #180318;
    background: var(--pink2);

    cursor: pointer;

    box-shadow:
        0 0 15px rgba(255,43,214,.2);
}

/* =========================
   MEMÓRIAS
========================= */

.memories {
    flex: 1;
    overflow: auto;
    padding: 15px;
}

.memory {
    padding: 14px;
    margin-bottom: 8px;

    border-radius: 12px;

    background:
        rgba(255,43,214,.045);

    border:
        1px solid rgba(255,43,214,.1);
}

.memory-title {
    font-size: 11px;
    color: var(--pink2);
}

.memory-text {
    margin-top: 5px;

    color: #856f82;
    font-size: 10px;
    line-height: 1.5;
}

/* =========================
   FINAL
========================= */

#ending {
    display: flex;
    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,43,214,.16),
            transparent 35%
        ),
        #080208;
}

.ending {
    width: min(700px, 90vw);
}

.ending-label {
    color: var(--pink);
    font-size: 10px;
    letter-spacing: 5px;
    margin-bottom: 20px;
}

.ending h1 {
    font-size: clamp(40px, 7vw, 90px);
    font-weight: 200;

    text-shadow:
        0 0 30px rgba(255,43,214,.35);
}

.ending p {
    margin: 25px auto 35px;

    max-width: 600px;

    color: #967e92;

    line-height: 1.7;
}

.restart {
    padding: 12px 23px;

    color: white;

    background:
        rgba(255,43,214,.08);

    border:
        1px solid rgba(255,43,214,.3);

    border-radius: 999px;

    cursor: pointer;
}

/* =========================
   TOAST
========================= */

.toast {
    position: fixed;
    z-index: 200;

    top: 25px;
    left: 50%;

    width: min(350px, 88vw);

    padding: 13px 15px;

    transform:
        translate(-50%, -150%);

    background:
        rgba(15,3,15,.94);

    border:
        1px solid rgba(255,43,214,.3);

    border-radius: 12px;

    box-shadow:
        0 0 30px rgba(255,43,214,.12);

    transition: .4s;
}

.toast.show {
    transform:
        translate(-50%, 0);
}

.toast-title {
    color: var(--pink2);
    font-size: 11px;
}

.toast-text {
    color: #967e92;
    font-size: 10px;
    margin-top: 4px;
}

/* =========================
   RESPONSIVO
========================= */

@media(max-width:700px) {

    .topbar {
        height: 60px;
    }

    .title {
        font-size: 9px;
        letter-spacing: 3px;
    }

    .story {
        padding-left: 14px;
        padding-right: 14px;
    }

    .narrator {
        font-size: 11px;
    }

    .phone {
        width: 94vw;
        height: 91vh;
        border-radius: 35px;
    }
}

@media(prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

<div id="app">

<!-- =========================
     INTRO
========================= -->

<section id="intro" class="screen active">

    <div class="noise"></div>

    <div class="intro-content">

        <div class="eyebrow">
            uma história sobre aquilo que insiste em voltar
        </div>

        <div class="logo">
            ECO <span>DA</span><br>
            MEIA-NOITE
        </div>

        <div class="logo-line"></div>

        <div class="subtitle">
            00:17.<br>
            Uma mensagem aparece no seu celular.
            <br>
            O problema é que o número não existe.
        </div>

        <button class="start" onclick="startGame()">
            COMEÇAR →
        </button>

    </div>

</section>


<!-- =========================
     HISTÓRIA
========================= -->

<section id="story" class="screen">

    <header class="topbar">

        <div class="title">
            <b>ECO</b> DA MEIA-NOITE
        </div>

        <div class="top-right">

            <div class="time" id="time">
                00:17
            </div>

            <button
                class="phone-button"
                onclick="openPhone()"
                aria-label="Abrir celular">
                ✦
            </button>

        </div>

    </header>


    <main class="scene">

        <div
            id="background"
            class="background room">
        </div>

        <div class="neon-light light-one"></div>
        <div class="neon-light light-two"></div>


        <div
            id="person"
            class="person">

            <div class="person-head"></div>
            <div class="person-body"></div>

        </div>


        <div class="story">

            <div class="story-inner">

                <div
                    class="location"
                    id="location">
                    QUARTO
                </div>

                <div
                    class="narrator"
                    id="narrator">
                </div>

                <div
                    class="dialogue"
                    id="dialogue">
                </div>

                <div
                    class="choices"
                    id="choices">
                </div>

            </div>

        </div>

    </main>

</section>


<!-- =========================
     CELULAR
========================= -->

<div
    id="phoneLayer"
    class="phone-layer">

    <div class="phone">

        <div class="notch"></div>

        <div class="phone-screen">


            <!-- HOME -->

            <section
                id="homePage"
                class="phone-page active">

                <div class="home">

                    <div
                        class="phone-clock"
                        id="phoneClock">
                        00:17
                    </div>

                    <div
                        class="phone-date">
                        madrugada — sexta-feira
                    </div>

                    <div class="apps">

                        <button
                            class="app"
                            onclick="openContacts()">

                            <div class="icon">💬</div>
                            <div class="label">Mensagens</div>

                        </button>

                        <button
                            class="app"
                            onclick="openMemories()">

                            <div class="icon">✦</div>
                            <div class="label">Memórias</div>

                        </button>

                        <button
                            class="app"
                            onclick="closePhone()">

                            <div class="icon">×</div>
                            <div class="label">Fechar</div>

                        </button>

                    </div>

                </div>

            </section>


            <!-- CONTATOS -->

            <section
                id="contactsPage"
                class="phone-page">

                <div class="phone-header">

                    <h2>Mensagens</h2>

                    <button onclick="openHome()">
                        Fechar
                    </button>

                </div>

                <div
                    id="contacts"
                    class="contacts">
                </div>

            </section>


            <!-- CHAT -->

            <section
                id="chatPage"
                class="phone-page">

                <div class="chat-head">

                    <button
                        class="chat-back"
                        onclick="openContacts()">
                        ←
                    </button>

                    <div
                        id="avatar"
                        class="avatar">
                        ?
                    </div>

                    <div class="chat-person">

                        <strong id="chatName">
                            —
                        </strong>

                        <span
                            id="status"
                            class="status">
                            online
                        </span>

                    </div>

                </div>

                <div
                    id="messages"
                    class="messages">
                </div>

                <form
                    id="chatForm"
                    class="input-area">

                    <input
                        id="messageInput"
                        autocomplete="off"
                        placeholder="Digite uma mensagem...">

                    <button type="submit">
                        ↑
                    </button>

                </form>

            </section>


            <!-- MEMÓRIAS -->

            <section
                id="memoriesPage"
                class="phone-page">

                <div class="phone-header">

                    <h2>Memórias</h2>

                    <button onclick="openHome()">
                        Fechar
                    </button>

                </div>

                <div
                    id="memories"
                    class="memories">
                </div>

            </section>

        </div>

    </div>

</div>


<!-- TOAST -->

<div
    id="toast"
    class="toast">

    <div
        id="toastTitle"
        class="toast-title">
    </div>

    <div
        id="toastText"
        class="toast-text">
    </div>

</div>


<!-- =========================
     FINAL
========================= -->

<section
    id="ending"
    class="screen">

    <div class="ending">

        <div class="ending-label">
            FIM DA TRANSMISSÃO
        </div>

        <h1 id="endingTitle">
            O ECO
        </h1>

        <p id="endingText">
        </p>

        <button
            class="restart"
            onclick="restartGame()">
            voltar ao começo
        </button>

    </div>

</section>

</div>


<script>

/* ========================================
   ESTADO
======================================== */

const game = {

    scene: "start",

    time: 17,

    memories: [],

    messages: {

        desconhecido: [
            {
                from: "them",
                text: "Você está acordado?",
                time: "00:17"
            },
            {
                from: "them",
                text: "Não olhe pela janela.",
                time: "00:17"
            }
        ],

        bia: [
            {
                from: "them",
                text: "Você ainda está acordado?",
                time: "23:54"
            }
        ],

        leo: [
            {
                from: "them",
                text: "Mano, preciso te contar uma coisa.",
                time: "00:03"
            }
        ]

    },

    relationships: {

        bia: {
            trust: 50,
            closeness: 50,
            irritation: 0
        },

        leo: {
            trust: 50,
            closeness: 55,
            irritation: 0
        }

    }

};


/* ========================================
   PERSONAGENS
======================================== */

const people = {

    desconhecido: {
        name: "Número desconhecido",
        initial: "?"
    },

    bia: {
        name: "Bia",
        initial: "B"
    },

    leo: {
        name: "Leo",
        initial: "L"
    }

};


/* ========================================
   CENAS
======================================== */

const scenes = {

    start: {

        location: "QUARTO",

        background: "room",

        narrator:
            "00:17. A cidade inteira parece estar dormindo.",

        dialogue:
            "Seu celular acende sozinho.",

        choices: [

            {
                text: "Pegar o celular",

                action: () => {

                    remember(
                        "A mensagem",
                        "Às 00:17, um número desconhecido perguntou se você estava acordado."
                    );

                    openPhone();

                    return null;
                }
            },

            {
                text: "Ignorar",

                action: () => {

                    return "window";
                }
            }

        ]

    },


    window: {

        location: "QUARTO",

        background: "room",

        narrator:
            "Você tenta voltar a dormir.",

        dialogue:
            "Então ouve três batidas na janela.",

        choices: [

            {
                text: "Olhar",

                action: () => {

                    remember(
                        "Três batidas",
                        "Você ouviu três batidas na janela às 00:19."
                    );

                    return "rooftop";
                }
            },

            {
                text: "Não olhar",

                action: () => {

                    return "message";
                }
            }

        ]

    },


    message: {

        location: "QUARTO",

        background: "room",

        narrator:
            "O celular vibra novamente.",

        dialogue:
            "\"Eu avisei você para não olhar pela janela.\"",

        choices: [

            {
                text: "Responder",

                action: () => {

                    openChat("desconhecido");

                    return null;
                }
            },

            {
                text: "Desligar o celular",

                action: () => {

                    remember(
                        "Celular desligado",
                        "Você decidiu ficar longe do aparelho."
                    );

                    return "rooftop";
                }
            }

        ]

    },


    rooftop: {

        location: "PRÉDIO",

        background: "rooftop",

        narrator:
            "Você sobe até o último andar.",

        dialogue:
            "No outro prédio, uma luz rosa pisca três vezes.",

        choices: [

            {
                text: "Seguir a luz",

                action: () => {

                    return "station";
                }
            },

            {
                text: "Voltar para casa",

                action: () => {

                    return "friends";
                }
            }

        ]

    },


    friends: {

        location: "RUA",

        background: "rooftop",

        narrator:
            "No caminho de volta, você decide ligar para alguém.",

        dialogue:
            "Bia atende no segundo toque.",

        choices: [

            {
                text: "Contar tudo para Bia",

                action: () => {

                    game.relationships.bia.trust += 10;

                    return "bia";
                }
            },

            {
                text: "Não contar nada",

                action: () => {

                    game.relationships.bia.trust -= 5;

                    return "leo";
                }
            }

        ]

    },


    bia: {

        location: "RUA",

        background: "rooftop",

        narrator:
            "Bia fica em silêncio durante alguns segundos.",

        dialogue:
            "— Essa mensagem... você recebeu exatamente às 00:17?",

        speaker: "BIA",

        choices: [

            {
                text: "Sim.",

                action: () => {

                    remember(
                        "Bia reconheceu o horário",
                        "Bia parece saber alguma coisa sobre a mensagem."
                    );

                    return "truth";
                }
            },

            {
                text: "Por quê?",

                action: () => {

                    return "truth";
                }
            }

        ]

    },


    leo: {

        location: "RUA",

        background: "rooftop",

        narrator:
            "Leo demora a responder.",

        dialogue:
            "— Você recebeu também, né?",

        speaker: "LEO",

        choices: [

            {
                text: "Recebi.",

                action: () => {

                    remember(
                        "Leo recebeu a mensagem",
                        "Leo também recebeu uma mensagem misteriosa durante a madrugada."
                    );

                    return "truth";
                }
            },

            {
                text: "Não sei do que você está falando.",

                action: () => {

                    game.relationships.leo.trust -= 10;

                    return "truth";
                }
            }

        ]

    },


    station: {

        location: "ESTAÇÃO ABANDONADA",

        background: "station",

        narrator:
            "A luz rosa vinha de uma antiga estação de rádio.",

        dialogue:
            "Uma transmissão começa quando você entra.",

        choices: [

            {
                text: "Ouvir",

                action: () => {

                    remember(
                        "A transmissão",
                        "Uma estação abandonada transmitia uma mensagem destinada a você."
                    );

                    return "truth";
                }
            },

            {
                text: "Ir embora",

                action: () => {

                    return "ending";
                }
            }

        ]

    },


    truth: {

        location: "ESTAÇÃO",

        background: "station",

        narrator:
            "A transmissão fica mais clara.",

        dialogue:
            "— Você já ouviu essa voz antes.",

        choices: [

            {
                text: "Continuar ouvindo",

                action: () => {

                    return "ending";
                }
            },

            {
                text: "Desligar tudo",

                action: () => {

                    return "ending";
                }
            }

        ]

    }

};


/* ========================================
   ELEMENTOS
======================================== */

const $ = id => document.getElementById(id);

const intro = $("intro");
const story = $("story");
const ending = $("ending");

const background = $("background");
const person = $("person");

const locationEl = $("location");
const narrator = $("narrator");
const dialogue = $("dialogue");
const choices = $("choices");

const phoneLayer = $("phoneLayer");

const contacts = $("contacts");
const messages = $("messages");
const memories = $("memories");

let currentChat = null;


/* ========================================
   INÍCIO
======================================== */

function startGame() {

    intro.classList.remove("active");
    story.classList.add("active");

    renderScene("start");

}


/* ========================================
   RENDER
======================================== */

function renderScene(sceneName) {

    if(sceneName === "ending") {

        showEnding();
        return;

    }

    const scene = scenes[sceneName];

    if(!scene) return;

    game.scene = sceneName;

    background.className =
        "background " + scene.background;

    locationEl.textContent =
        scene.location;

    narrator.textContent =
        scene.narrator;

    dialogue.innerHTML = "";

    if(scene.speaker) {

        dialogue.innerHTML = `
            <span class="speaker">
                ${scene.speaker}
            </span>
            ${escapeHTML(scene.dialogue)}
        `;

    } else {

        dialogue.textContent =
            scene.dialogue;

    }

    choices.innerHTML = "";

    scene.choices.forEach(choice => {

        const button =
            document.createElement("button");

        button.className = "choice";

        button.textContent =
            choice.text;

        button.onclick = () => {

            const next =
                choice.action();

            if(next) {

                advanceTime(2);

                renderScene(next);

            }

        };

        choices.appendChild(button);

    });

}


/* ========================================
   TEMPO
======================================== */

function advanceTime(minutes) {

    game.time += minutes;

    const total =
        17 + game.time - 17;

    const hours =
        Math.floor(total / 60);

    const minutesPart =
        total % 60;

    const text =
        String(hours).padStart(2,"0")
        + ":"
        + String(minutesPart).padStart(2,"0");

    $("time").textContent = text;
    $("phoneClock").textContent = text;

}


/* ========================================
   MEMÓRIAS
======================================== */

function remember(title, text) {

    game.memories.unshift({
        title,
        text
    });

    renderMemories();

}


/* ========================================
   MEMÓRIAS
======================================== */

function renderMemories() {

    memories.innerHTML = "";

    if(!game.memories.length) {

        memories.innerHTML = `
            <div class="memory">
                Nenhuma memória registrada.
            </div>
        `;

        return;

    }

    game.memories.forEach(memory => {

        const element =
            document.createElement("div");

        element.className = "memory";

        element.innerHTML = `
            <div class="memory-title">
                ${escapeHTML(memory.title)}
            </div>

            <div class="memory-text">
                ${escapeHTML(memory.text)}
            </div>
        `;

        memories.appendChild(element);

    });

}


/* ========================================
   CELULAR
======================================== */

function openPhone() {

    phoneLayer.classList.add("open");

    openHome();

}


function closePhone() {

    phoneLayer.classList.remove("open");

}


function switchPage(id) {

    document
        .querySelectorAll(".phone-page")
        .forEach(page => {

            page.classList.remove("active");

        });

    $(id).classList.add("active");

}


function openHome() {

    switchPage("homePage");

}


function openContacts() {

    renderContacts();

    switchPage("contactsPage");

}


function openMemories() {

    renderMemories();

    switchPage("memoriesPage");

}


/* ========================================
   CONTATOS
======================================== */

function renderContacts() {

    contacts.innerHTML = "";

    Object.keys(game.messages)
        .forEach(id => {

            const personData =
                people[id];

            const list =
                game.messages[id];

            const last =
                list[list.length - 1];

            const button =
                document.createElement("button");

            button.className = "contact";

            button.innerHTML = `

                <div class="avatar">
                    ${personData.initial}
                </div>

                <div class="contact-info">

                    <div class="contact-name">
                        ${personData.name}
                    </div>

                    <div class="contact-last">
                        ${escapeHTML(last.text)}
                    </div>

                </div>

            `;

            button.onclick = () =>
                openChat(id);

            contacts.appendChild(button);

        });

}


/* ========================================
   CHAT
======================================== */

function openChat(id) {

    currentChat = id;

    $("chatName").textContent =
        people[id].name;

    $("avatar").textContent =
        people[id].initial;

    renderChat();

    switchPage("chatPage");

}


function renderChat() {

    messages.innerHTML = "";

    game.messages[currentChat]
        .forEach(message => {

            const element =
                document.createElement("div");

            element.className =
                "message " +
                (
                    message.from === "me"
                        ? "me"
                        : "them"
                );

            element.textContent =
                message.text;

            messages.appendChild(element);

        });

    messages.scrollTop =
        messages.scrollHeight;

}


/* ========================================
   RESPOSTA DO CHAT
======================================== */

$("chatForm").addEventListener(
    "submit",
    event => {

        event.preventDefault();

        const input =
            $("messageInput");

        const text =
            input.value.trim();

        if(!text) return;

        game.messages[currentChat].push({

            from: "me",
            text,
            time: "agora"

        });

        input.value = "";

        renderChat();

        setTimeout(() => {

            let reply =
                "Eu sabia que você responderia.";

            if(currentChat === "desconhecido") {

                reply =
                    "Não devia ter respondido.";

            }

            if(currentChat === "bia") {

                reply =
                    "Então você também está vendo isso.";

            }

            if(currentChat === "leo") {

                reply =
                    "A gente precisa se encontrar.";

            }

            game.messages[currentChat].push({

                from: "them",
                text: reply,
                time: "agora"

            });

            renderChat();

            showToast(
                people[currentChat].name,
                reply
            );

        }, 700);

    }
);


/* ========================================
   TOAST
======================================== */

let toastTimer;

function showToast(title, text) {

    $("toastTitle").textContent =
        title;

    $("toastText").textContent =
        text;

    $("toast").classList.add("show");

    clearTimeout(toastTimer);

    toastTimer =
        setTimeout(() => {

            $("toast").classList.remove("show");

        }, 3000);

}


/* ========================================
   FINAL
======================================== */

function showEnding() {

    story.classList.remove("active");

    ending.classList.add("active");

    const memoriesCount =
        game.memories.length;

    if(memoriesCount >= 3) {

        $("endingTitle").textContent =
            "VOCÊ OUVIU";

        $("endingText").textContent =
            "Você seguiu os sinais até o fim. " +
            "A transmissão terminou, mas a última voz " +
            "parecia estar falando diretamente com você.";

    } else {

        $("endingTitle").textContent =
            "O ECO";

        $("endingText").textContent =
            "Você deixou algumas respostas para trás. " +
            "Talvez algumas coisas sejam melhores quando " +
            "permanecem sem explicação.";

    }

}


function restartGame() {

    location.reload();

}


/* ========================================
   SEGURANÇA
======================================== */

function escapeHTML(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ========================================
   TECLA ESC
======================================== */

document.addEventListener(
    "keydown",
    event => {

        if(event.key === "Escape") {

            closePhone();

        }

    }
);

</script>

</body>
</html>
