<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ENTRELINHAS — Marina</title>

<style>
:root{
    --bg:#050608;
    --text:#f4f4f6;
    --muted:#9297a2;
    --line:rgba(255,255,255,.12);
    --accent:#e8b7c8;
    --pink:#d889a7;
    --success:#78e2a0;
    --story-bottom:clamp(18px,4vh,58px);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden!important;
    background:#000;
    color:var(--text);
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
    position:fixed;
    inset:0;
}

button,input{
    font:inherit;
}

button{
    border:0;
}

#app{
    position:fixed;
    inset:0;
    width:100vw;
    height:100dvh;
    overflow:hidden;
    background:#050608;
}

.screen{
    position:absolute;
    inset:0;
    opacity:0;
    pointer-events:none;
    transform:scale(1.015);
    transition:opacity .55s ease,transform .55s ease;
}

.screen.active{
    opacity:1;
    pointer-events:auto;
    transform:scale(1);
}

/* INTRO */

#intro{
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle at 50% 35%,rgba(216,137,167,.13),transparent 38%),
        radial-gradient(circle at 50% 70%,rgba(100,110,150,.08),transparent 35%),
        #050608;
}

.intro-noise{
    position:absolute;
    inset:0;
    opacity:.045;
    pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
}

.intro-center{
    position:relative;
    z-index:2;
    width:min(720px,90vw);
    text-align:center;
    animation:introIn 1.4s ease both;
}

.intro-small{
    color:#9295a0;
    font-size:clamp(9px,1vw,13px);
    letter-spacing:clamp(3px,.5vw,7px);
    text-transform:uppercase;
    margin-bottom:22px;
}

.logo{
    font-size:clamp(54px,9vw,145px);
    line-height:.85;
    letter-spacing:clamp(5px,1.2vw,20px);
    font-weight:300;
    color:#f5f5f7;
    text-shadow:0 0 45px rgba(216,137,167,.13);
}

.logo-line{
    width:min(230px,35vw);
    height:1px;
    background:linear-gradient(90deg,transparent,#e8b7c8,transparent);
    margin:30px auto;
    opacity:.45;
}

.intro-sub{
    color:#90939e;
    font-size:clamp(12px,1.4vw,17px);
    letter-spacing:2px;
    margin-bottom:38px;
    line-height:1.7;
}

.start-btn{
    padding:15px 28px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:999px;
    color:#fff;
    background:rgba(255,255,255,.045);
    cursor:pointer;
    transition:.25s;
}

.start-btn:hover{
    background:rgba(216,137,167,.12);
    border-color:rgba(232,183,200,.5);
    transform:translateY(-2px);
}

.start-btn span{
    margin-left:8px;
    opacity:.6;
}

@keyframes introIn{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:none}
}

/* STORY */

#story{
    background:#050608;
}

.topbar{
    position:absolute;
    z-index:40;
    top:0;
    left:0;
    right:0;
    height:clamp(54px,7vh,76px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 clamp(16px,3vw,48px);
    background:linear-gradient(to bottom,rgba(0,0,0,.72),transparent);
}

.story-title{
    font-size:clamp(10px,1vw,13px);
    letter-spacing:clamp(2px,.35vw,5px);
    color:rgba(255,255,255,.68);
    text-transform:uppercase;
}

.top-right{
    display:flex;
    align-items:center;
    gap:10px;
}

.time{
    color:rgba(255,255,255,.55);
    font-size:12px;
}

.phone-open{
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    cursor:pointer;
    transition:.25s;
    position:relative;
}

.phone-open:hover{
    background:rgba(216,137,167,.18);
    transform:scale(1.05);
}

.phone-badge{
    position:absolute;
    top:-2px;
    right:-2px;
    min-width:15px;
    height:15px;
    padding:0 4px;
    border-radius:20px;
    display:none;
    align-items:center;
    justify-content:center;
    background:#fff;
    color:#111;
    font-size:9px;
    font-weight:800;
}

.phone-badge.visible{
    display:flex;
}

/* CENAS */

.scene{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.scene-image{
    position:absolute;
    inset:0;
    overflow:hidden;
}

.scene-image::after{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(to bottom,
        rgba(0,0,0,.18),
        transparent 30%,
        rgba(0,0,0,.15) 55%,
        rgba(0,0,0,.88) 100%);
}

.art{
    position:absolute;
    inset:-3%;
    width:106%;
    height:106%;
    transition:opacity .8s ease,transform 1.2s cubic-bezier(.2,.7,.2,1);
    animation:sceneBreath 12s ease-in-out infinite alternate;
}

.art.hidden{
    opacity:0;
}

@keyframes sceneBreath{
    from{transform:scale(1)}
    to{transform:scale(1.035)}
}

/* QUARTO */

.room{
    background:
        radial-gradient(ellipse at 72% 22%,rgba(190,150,180,.16),transparent 25%),
        linear-gradient(110deg,#11151d 0%,#090b10 45%,#17131b 100%);
}

.room::before{
    content:"";
    position:absolute;
    width:42%;
    height:70%;
    right:7%;
    top:9%;
    background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.13),rgba(255,255,255,.02));
    box-shadow:0 0 100px rgba(210,150,190,.08);
    transform:skewY(-3deg);
}

.room::after{
    content:"";
    position:absolute;
    width:45%;
    height:15%;
    left:3%;
    bottom:7%;
    background:#08090c;
    border-radius:50%;
    box-shadow:0 -18px 0 -5px #171b23;
}

/* CAFÉ */

.cafe{
    background:
        radial-gradient(ellipse at 50% 35%,rgba(235,175,190,.2),transparent 25%),
        linear-gradient(125deg,#171116,#21171b 50%,#090708);
}

.cafe::before{
    content:"";
    position:absolute;
    left:12%;
    top:13%;
    width:76%;
    height:48%;
    border:1px solid rgba(255,255,255,.05);
    background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.3));
    box-shadow:0 0 80px rgba(220,150,180,.1);
}

.cafe::after{
    content:"";
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    height:33%;
    background:linear-gradient(to top,#050505,transparent);
}

/* PRAÇA */

.street{
    background:
        radial-gradient(ellipse at 70% 35%,rgba(220,180,210,.22),transparent 14%),
        linear-gradient(135deg,#0a0d12,#17131b 48%,#06070a);
}

.street::before{
    content:"";
    position:absolute;
    width:55%;
    height:130%;
    left:15%;
    top:-10%;
    transform:skewX(-16deg);
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 5px,transparent 5px 75px);
}

.street::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    height:40%;
    background:linear-gradient(to top,#030405,transparent);
}

/* CHUVA */

.rain{
    position:absolute;
    inset:0;
    z-index:3;
    pointer-events:none;
    opacity:.25;
    background-image:repeating-linear-gradient(110deg,transparent 0 13px,rgba(220,190,205,.18) 14px,transparent 15px 29px);
    animation:rainMove .7s linear infinite;
}

@keyframes rainMove{
    from{transform:translateY(-20px)}
    to{transform:translateY(20px)}
}

/* MARINA */

.character{
    position:absolute;
    bottom:7%;
    left:50%;
    width:clamp(130px,18vw,300px);
    height:clamp(300px,64vh,650px);
    transform:translateX(-50%);
    opacity:.92;
    pointer-events:none;
    transition:.7s;
    z-index:5;
}

.character.hidden{
    opacity:0;
    transform:translateX(-50%) translateY(30px);
}

.character .head{
    position:absolute;
    top:0;
    left:50%;
    width:24%;
    aspect-ratio:1;
    transform:translateX(-50%);
    border-radius:50%;
    background:
        radial-gradient(circle at 40% 35%,#c7b1b5,#65565b 70%,#252326);
    box-shadow:0 0 35px rgba(235,170,200,.1);
}

.character .body{
    position:absolute;
    left:50%;
    bottom:0;
    width:72%;
    height:78%;
    transform:translateX(-50%);
    border-radius:35% 35% 8% 8%;
    background:linear-gradient(100deg,#21171d,#09090c 65%,#241a20);
    box-shadow:0 0 70px rgba(0,0,0,.8);
}

/* STORY TEXT */

.story-layer{
    position:absolute;
    z-index:20;
    left:0;
    right:0;
    bottom:0;
    padding:0 clamp(14px,5vw,100px) var(--story-bottom);
}

.story-content{
    width:min(1100px,100%);
    margin:auto;
}

.scene-location{
    display:flex;
    align-items:center;
    gap:9px;
    color:rgba(255,255,255,.48);
    font-size:clamp(9px,1vw,12px);
    letter-spacing:3px;
    text-transform:uppercase;
    margin-bottom:10px;
}

.scene-location::before{
    content:"";
    width:24px;
    height:1px;
    background:rgba(232,183,200,.6);
}

.narrator{
    color:rgba(255,255,255,.55);
    font-size:clamp(11px,1.25vw,15px);
    line-height:1.5;
    margin-bottom:10px;
    max-width:850px;
}

.dialogue{
    font-size:clamp(19px,2.5vw,36px);
    line-height:1.15;
    max-width:1000px;
    text-wrap:balance;
    text-shadow:0 2px 25px rgba(0,0,0,.8);
}

.speaker{
    display:block;
    font-size:clamp(9px,1vw,12px);
    letter-spacing:3px;
    color:rgba(255,255,255,.48);
    text-transform:uppercase;
    margin-bottom:6px;
}

/* ESCOLHAS */

.choices{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:8px;
    margin-top:18px;
    max-width:920px;
}

.choice{
    min-width:0;
    min-height:48px;
    padding:12px 16px;
    color:#e8e8eb;
    text-align:left;
    background:rgba(5,6,9,.6);
    border:1px solid rgba(255,255,255,.12);
    border-radius:8px;
    cursor:pointer;
    backdrop-filter:blur(12px);
    transition:.2s;
}

.choice:hover{
    background:rgba(216,137,167,.12);
    border-color:rgba(232,183,200,.4);
    transform:translateY(-2px);
}

.choice small{
    display:block;
    color:rgba(255,255,255,.38);
    margin-top:4px;
    font-size:10px;
}

.continue{
    display:inline-flex;
    align-items:center;
    gap:10px;
    margin-top:18px;
    padding:10px 17px;
    border-radius:999px;
    color:#fff;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.15);
    cursor:pointer;
}

/* PHONE */

#phoneLayer{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
    background:rgba(0,0,0,.72);
    backdrop-filter:blur(12px);
    opacity:0;
    pointer-events:none;
    transition:.3s;
}

#phoneLayer.open{
    opacity:1;
    pointer-events:auto;
}

.phone{
    position:relative;
    width:min(390px,88vw);
    height:min(760px,88dvh);
    max-height:88dvh;
    border:7px solid #17191e;
    border-radius:clamp(30px,4vw,46px);
    overflow:hidden;
    background:#08090c;
    box-shadow:0 40px 100px rgba(0,0,0,.75),0 0 0 1px rgba(255,255,255,.08);
    transform:translateY(30px) scale(.94);
    transition:.4s cubic-bezier(.2,.8,.2,1);
}

#phoneLayer.open .phone{
    transform:translateY(0) scale(1);
}

.phone-notch{
    position:absolute;
    z-index:50;
    top:7px;
    left:50%;
    transform:translateX(-50%);
    width:100px;
    height:25px;
    border-radius:0 0 16px 16px;
    background:#050608;
}

.phone-screen{
    position:absolute;
    inset:0;
    overflow:hidden;
    background:linear-gradient(145deg,#11141a,#07080b);
}

.phone-page{
    position:absolute;
    inset:0;
    display:none;
    flex-direction:column;
    min-height:0;
    overflow:hidden;
}

.phone-page.active{
    display:flex;
}

.phone-header{
    flex:none;
    height:64px;
    padding:25px 18px 5px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.phone-header h2{
    font-size:17px;
    font-weight:500;
}

.phone-header button{
    color:#aaa;
    background:none;
    cursor:pointer;
}

.phone-home{
    flex:1;
    padding:90px 22px 22px;
    overflow:hidden;
}

.phone-clock{
    font-size:52px;
    font-weight:200;
    letter-spacing:-3px;
}

.phone-date{
    color:#777c86;
    font-size:12px;
}

.phone-apps{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
    margin-top:45px;
}

.app{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:7px;
    color:#aaa;
    cursor:pointer;
    background:none;
}

.app-icon{
    width:57px;
    height:57px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:17px;
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.07);
    font-size:22px;
    position:relative;
}

.app-label{
    font-size:10px;
}

.app-badge{
    position:absolute;
    top:-5px;
    right:-5px;
    min-width:17px;
    height:17px;
    padding:0 4px;
    border-radius:20px;
    background:#fff;
    color:#111;
    display:none;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:800;
}

.app-badge.show{
    display:flex;
}

.contact-list{
    flex:1;
    min-height:0;
    padding:12px;
    overflow:auto;
    scrollbar-width:none;
}

.contact-list::-webkit-scrollbar{
    display:none;
}

.contact{
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 8px;
    color:#eee;
    background:none;
    border-bottom:1px solid rgba(255,255,255,.05);
    cursor:pointer;
    text-align:left;
}

.avatar{
    width:42px;
    height:42px;
    flex:none;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#513a45,#15171c);
    color:#eee;
    font-size:13px;
}

.contact-info{
    min-width:0;
    flex:1;
}

.contact-name{
    font-size:13px;
}

.contact-last{
    color:#6f737d;
    font-size:10px;
    margin-top:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.chat-head{
    flex:none;
    height:65px;
    display:flex;
    align-items:flex-end;
    padding:25px 12px 8px;
    gap:10px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.chat-back{
    color:#aaa;
    background:none;
    cursor:pointer;
    padding:5px;
}

.chat-person{
    flex:1;
}

.chat-person strong{
    display:block;
    font-size:13px;
}

.chat-status{
    display:block;
    color:#656a74;
    font-size:9px;
    margin-top:2px;
}

.chat-messages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:15px 12px 12px;
    scrollbar-width:none;
    display:flex;
    flex-direction:column;
    gap:7px;
}

.chat-messages::-webkit-scrollbar{
    display:none;
}

.message{
    max-width:78%;
    padding:9px 11px;
    border-radius:15px;
    font-size:12px;
    line-height:1.35;
    animation:messageIn .25s ease both;
}

.message.me{
    align-self:flex-end;
    background:#e9e9ea;
    color:#111;
    border-bottom-right-radius:4px;
}

.message.them{
    align-self:flex-start;
    background:#252028;
    color:#eee;
    border-bottom-left-radius:4px;
}

.message-time{
    display:block;
    margin-top:3px;
    font-size:8px;
    opacity:.38;
    text-align:right;
}

@keyframes messageIn{
    from{opacity:0;transform:translateY(8px) scale(.98)}
    to{opacity:1;transform:none}
}

.chat-input{
    flex:none;
    display:flex;
    gap:6px;
    padding:8px;
    border-top:1px solid rgba(255,255,255,.08);
}

.chat-input input{
    flex:1;
    min-width:0;
    height:38px;
    padding:0 12px;
    color:#eee;
    outline:none;
    border:1px solid rgba(255,255,255,.08);
    border-radius:20px;
    background:#14161b;
